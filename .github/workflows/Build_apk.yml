name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug -Djava.awt.headless=true -Dorg.gradle.daemon=false
          else
            GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
            if [ -n "$GRADLEW_PATH" ]; then
              CD_DIR=$(dirname "$GRADLEW_PATH")
              cd "$CD_DIR"
              chmod +x gradlew
              ./gradlew assembleDebug -Djava.awt.headless=true -Dorg.gradle.daemon=false
            else
              gradle assembleDebug -Djava.awt.headless=true -Dorg.gradle.daemon=false
            fi
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
